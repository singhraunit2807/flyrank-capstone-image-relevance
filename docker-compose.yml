services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_PATH: /app/data/flyrank.db
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - ./data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
